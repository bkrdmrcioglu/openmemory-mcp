name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openmemory
          POSTGRES_PASSWORD: openmemory
          POSTGRES_DB: openmemory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmemory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openmemory:openmemory@localhost:5432/openmemory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
